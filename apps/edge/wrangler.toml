name = "shortn-edge"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Everything that isn't a redirect path, and every failed redirect, goes to
# the zone's own origin (legacy): subrequests to the routed host skip the Worker.
# Hitting the free plan's daily limit falls through to the zone's origin
# (legacy, which resolves every key) instead of erroring (13 §Edge routing).
# shortn.at, like staging, is served as a Cloudflare-for-SaaS custom hostname of
# denizlg24.com (Forge), so its routes attach to that provider zone.
routes = [
  { pattern = "shortn.at/*", zone_name = "denizlg24.com" },
  { pattern = "api.shortn.at/*", zone_name = "denizlg24.com" },
  # Everything proxied in the shortn.at zone: {handle}.shortn.at (a proxied `*`
  # AAAA 100:: record) and customer domains (Cloudflare for SaaS custom
  # hostnames on this zone, fallback cname.shortn.at). Reserved subdomains
  # pass through; customer hosts go to the redirect origin.
  { pattern = "*/*", zone_name = "shortn.at" },
]

[vars]
API_PUBLIC_HOST = "api.shortn.at"
REDIRECT_ORIGIN = "https://shortn-redirect.denizlg24.com"
# Kill switch, not a ramp: 100 in normal operation, 0 to roll back (14 P2).
CANARY_PERCENT = "100"
# Secrets (`wrangler secret put`): EDGE_AUTH_SECRET, API_EDGE_AUTH_SECRET,
# WEB_EDGE_AUTH_SECRET, BIO_INTERNAL_SECRET.
# P4 column (14, 16 §4.8) and PM cutover (20 M.9), switched on 2026-10-18:
WEB_ORIGIN = "https://app.shortn.at"
DASHBOARD_HANDOFF = "1"
MARKETING_ENABLED = "1"
# P5: new bio renderer, {handle}.shortn.at subdomains, and /b/{slug} 301s to
# the handle (live 2026-10-18).
BIO_DELIVERY_ENABLED = "1"
BIO_SUBDOMAINS = "1"
BIO_LEGACY_REDIRECTS = "1"

# Cloudflare-side limit on the demo shortener and contact posts, per visitor
# address, in front of the app's own per-visitor and daily limits.
[[ratelimits]]
name = "FORM_RATE_LIMITER"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[env.staging]
name = "shortn-edge-staging"
# staging.shortn.at is a Cloudflare-for-SaaS custom hostname of denizlg24.com
# (Forge). Its record in the shortn.at zone isn't proxied, so the request
# never touches that zone's Worker routes; it lands on the provider zone.
routes = [
  { pattern = "staging.shortn.at/*", zone_name = "denizlg24.com" },
  { pattern = "api-staging.shortn.at/*", zone_name = "denizlg24.com" },
]

[env.staging.vars]
API_PUBLIC_HOST = "api-staging.shortn.at"
REDIRECT_ORIGIN = "https://shortn-redirect-staging.denizlg24.com"
CANARY_PERCENT = "100"
WEB_ORIGIN = "https://app-staging.shortn.at"
DASHBOARD_HANDOFF = "1"
MARKETING_ENABLED = "1"
# P5 renderer through the edge; /b/{slug} renders in place (no wildcard on staging).
BIO_DELIVERY_ENABLED = "1"
BIO_LEGACY_REDIRECTS = "0"

# Cloudflare-side limit on the demo shortener and contact posts, per visitor
# address, in front of the app's own per-visitor and daily limits.
[[env.staging.ratelimits]]
name = "FORM_RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }
