services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 1)",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        mongosh "mongodb://mongo:27017/?directConnection=true" --quiet --eval
        'try { rs.status() } catch { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}) }';
        for attempt in {1..60}; do
          mongosh "mongodb://mongo:27017/?directConnection=true" --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && exit 0;
          sleep 1;
        done;
        exit 1
  redis-cache:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis-durable:
    image: redis:7
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
